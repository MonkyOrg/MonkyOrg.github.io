<!doctype html>
<!--
  Modelo da imagem de prévia (Open Graph) do site da org. Não é publicado: a
  pasta começa com `_`, e o Jekyll do GitHub Pages ignora. O `gerar.mjs` desta
  pasta abre este arquivo num Chrome/Edge headless, uma vez por idioma
  (`?lang=pt`), e salva o JPEG em `og/`. Mesma identidade do modelo da
  documentação (MonkyOrg/Monky, `docs-site/og/template.html`).
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,500,1,0&display=block">
<style>
  :root {
    --bg-app: #0b0e14;
    --accent: #5865f2;
    --text-primary: #f0f3f6;
    --text-secondary: #9da7b3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(520px 420px at 290px 330px, rgb(88 101 242 / 26%), transparent 70%),
      radial-gradient(560px 360px at 1120px -40px, rgb(35 165 90 / 16%), transparent 70%),
      linear-gradient(160deg, #0f131b, var(--bg-app) 60%);
  }
  .icon {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    white-space: nowrap;
    font-feature-settings: 'liga';
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 48;
  }
  .mascot {
    position: absolute;
    left: 70px;
    top: 115px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    border: 3px solid rgb(88 101 242 / 70%);
    background: rgb(22 27 34 / 85%);
    box-shadow: 0 0 0 28px rgb(88 101 242 / 7%);
  }
  .mascot img {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 320px;
    height: 320px;
  }
  .badge {
    position: absolute;
    right: 10px;
    bottom: 34px;
    width: 104px;
    height: 104px;
    border-radius: 50%;
    border: 10px solid var(--bg-app);
    background: var(--accent);
    display: grid;
    place-items: center;
  }
  .badge .icon { font-size: 46px; color: #fff; }
  .content {
    position: absolute;
    left: 540px;
    right: 50px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  h1 {
    font-size: 132px;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .subtitle {
    margin-top: 18px;
    font-size: 38px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-secondary);
  }
  .chips {
    display: flex;
    gap: 10px;
    margin-top: 40px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 15px 12px 12px;
    white-space: nowrap;
    border: 2px solid rgb(88 101 242 / 45%);
    border-radius: 16px;
    background: rgb(28 35 45 / 90%);
    font-size: 25px;
    font-weight: 600;
  }
  .chip .icon {
    font-size: 28px;
    color: #a2a8ff;
  }
</style>
</head>
<body>
  <div class="mascot">
    <img src="../logo.png" alt="">
    <div class="badge"><span class="icon">groups</span></div>
  </div>
  <div class="content">
    <h1>Monky</h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="chips" id="chips"></div>
  </div>
<script>
  const texts = {
    subtitle: { pt: 'No seu próprio servidor', en: 'On your own server' },
    chips: [
      ['chat', { pt: 'Chat', en: 'Chat' }],
      ['mic', { pt: 'Voz', en: 'Voice' }],
      ['videocam', { pt: 'Vídeo', en: 'Video' }],
      ['screen_share', { pt: 'Tela', en: 'Screen' }],
    ],
  };

  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'pt';
  document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';
  document.getElementById('subtitle').textContent = texts.subtitle[lang];
  const chips = document.getElementById('chips');
  for (const [icon, label] of texts.chips) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    const glyph = document.createElement('span');
    glyph.className = 'icon';
    glyph.textContent = icon;
    chip.append(glyph, label[lang]);
    chips.append(chip);
  }
</script>
</body>
</html>
